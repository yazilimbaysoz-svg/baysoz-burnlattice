# BurnLattice CI - Baysöz Labs <baysozlabs@proton.me>
name: burnlattice-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zero-defect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Baysöz Labs <baysozlabs@proton.me>)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Create environment and install project
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep
      - name: Unit and adversarial tests
        run: uv run pytest -q
      - name: Static analysis
        run: uv run ruff check --select E,F,W,S,B .
      - name: Security analysis
        run: uv run semgrep --config p/default --error .
